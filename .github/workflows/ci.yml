name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP (lint, style, analyse, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: php bin/console lint:container
      - run: php bin/console lint:twig templates
      - run: php bin/console lint:yaml config --parse-tags
      - run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
      # PHPStan lit le conteneur compilé de l'environnement dev.
      - run: php bin/console cache:warmup --env=dev
      # Les tests fonctionnels rendent base.html.twig, qui a besoin du CSS compilé.
      - run: php bin/console sass:build
      - run: vendor/bin/phpstan analyse --no-progress
      - run: php bin/phpunit

  assets:
    name: Assets (Sass, carte des assets, contrastes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --no-scripts
      - run: php bin/console sass:build
      - run: APP_SECRET=secret-ci php bin/console asset-map:compile --env=prod
      - run: python3 tests/contrast.py

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: composer install --no-interaction --no-progress
      - run: php bin/console sass:build
      - run: APP_SECRET=secret-ci php bin/console asset-map:compile
      - name: Serveur local
        run: |
          APP_ENV=dev APP_SECRET=secret-ci DEFAULT_URI=http://localhost \
            php -S 127.0.0.1:8087 -t public tests/e2e/router.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:8087/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8087/missions
      - run: node tests/e2e/browser.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Journal du serveur si echec
        if: failure()
        run: tail -50 /tmp/server.log

  image:
    name: Image (GHCR)
    needs: [php, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Sur une PR, l'image est construite pour vérifier le Dockerfile, sans être publiée.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # :latest seulement depuis main : c'est l'étiquette que le serveur déploie.
          tags: |
            ghcr.io/${{ github.repository_owner }}/guilloche:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/guilloche:latest', github.repository_owner) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
