webpack_encore:
    output_path: '%kernel.project_dir%/public/build'
    # Turbo Drive recharge la page entière quand les assets compilés changent.
    script_attributes:
        defer: true
        'data-turbo-track': reload
    link_attributes:
        'data-turbo-track': reload

framework:
    assets:
        json_manifest_path: '%kernel.project_dir%/public/build/manifest.json'

when@prod:
    webpack_encore:
        cache: true

when@test:
    webpack_encore:
        strict_mode: false
